name: Fix Inline Shell Patcher Anchor
on:
  push:
    branches: [feature/inline-terminal-shell-path]
    paths: [.github/workflows/fix-inline-shell-patcher-anchor.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/inline-terminal-shell-path
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-inline-terminal-shell-path-v2.yml')
          s=p.read_text()
          a="a=s.find('\\tprivate async getSystemPrompt(): Promise<string> {')"
          b="a=s.find('\\t/*private kilocode_change*/ async getSystemPrompt(): Promise<string> {')"
          assert s.count(a)==1
          p.write_text(s.replace(a,b,1))
          PY
          git rm .github/workflows/fix-inline-shell-patcher-anchor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: fix task system prompt patch anchor"
          git push origin HEAD:feature/inline-terminal-shell-path
