name: Apply Inline Terminal Shell Patch v2

on:
  push:
    branches: [feature/inline-terminal-shell-path]
    paths: [.github/workflows/apply-inline-terminal-shell-path-v2.yml]

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/inline-terminal-shell-path
      - name: Apply guarded source updates
        run: python3 .github/scripts/apply-inline-terminal-shell-path.py
      - name: Remove one-shot helpers
        run: git rm .github/workflows/apply-inline-terminal-shell-path.yml .github/workflows/apply-inline-terminal-shell-path-v2.yml .github/workflows/fix-inline-shell-patcher-anchor.yml .github/scripts/apply-inline-terminal-shell-path.py 2>/dev/null || true
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: configure inline terminal shell path"
          git push origin HEAD:feature/inline-terminal-shell-path
