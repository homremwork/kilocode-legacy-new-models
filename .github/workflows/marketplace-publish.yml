name: Publish Extension
on:
    pull_request:
        types: [closed]
    workflow_dispatch:

env:
    GIT_REF: main
    NODE_VERSION: 20.20.0
    PNPM_VERSION: 10.16.0
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    create-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        if: >
            ( github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'main' &&
            contains(github.event.pull_request.title, 'Changeset version bump') ) ||
            github.event_name == 'workflow_dispatch'
        outputs:
            version: ${{ steps.get-version.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: main
                  fetch-depth: 0
            - name: Finalize 5.17.2 source
              if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
              run: |
                  python3 <<'PY'
                  from pathlib import Path
                  import json

                  package_path = Path('src/package.json')
                  package = json.loads(package_path.read_text())
                  package['version'] = '5.17.2'
                  package_path.write_text(json.dumps(package, ensure_ascii=False, indent='\t') + '\n')

                  changelog_path = Path('CHANGELOG.md')
                  changelog = changelog_path.read_text()
                  entry = '''## 5.17.2

                  ### Fixed

                  - Restored JCEF WebView support in CLion 2026.2 while keeping the JetBrains plugin build compatible with IntelliJ Platform 2025.3.1.

                  '''
                  if not changelog.startswith('## 5.17.2\n'):
                      changelog_path.write_text(entry + changelog)

                  gradle_path = Path('jetbrains/plugin/build.gradle.kts')
                  gradle = gradle_path.read_text()
                  gradle = gradle.replace('\n        bundledModule("intellij.platform.ui.jcef")\n', '\n')
                  gradle = gradle.replace('\n        bundledPlugin("intellij.platform.ui.jcef")\n', '\n')
                  gradle_path.write_text(gradle)

                  temporary = Path('.github/workflows/prepare-release-5.17.2.yml')
                  if temporary.exists():
                      temporary.unlink()
                  PY
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "fix(jetbrains): finalize CLion 2026.2 JCEF support"
                  git push origin main
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install
            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
            - name: Create .env file
              run: echo "KILOCODE_POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> .env
            - name: Get version
              id: get-version
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  echo "version=${current_package_version}" >> $GITHUB_OUTPUT
                  echo "Version: ${current_package_version}"
            - name: Package Extension
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  pnpm vsix:production
                  unzip -l bin/kilo-code-${current_package_version}.vsix > /tmp/kilo-code-vsix-contents.txt
                  grep -q "extension/package.json" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/package.nls.json" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/dist/extension.js" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/webview-ui/audio/celebration.wav" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/webview-ui/build/assets/index.js" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/assets/codicons/codicon.ttf" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q ".env" /tmp/kilo-code-vsix-contents.txt || exit 1
                  rm /tmp/kilo-code-vsix-contents.txt
            - name: Create and Push Git Tag
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  if git ls-remote --tags origin | grep -q "refs/tags/v${current_package_version}$"; then
                    echo "Tag v${current_package_version} already exists remotely, skipping tag creation"
                  else
                    git tag -a "v${current_package_version}" -m "Release v${current_package_version}"
                    git push origin "v${current_package_version}" --no-verify
                  fi
            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  if gh release view "v${current_package_version}" >/dev/null 2>&1; then
                    gh release upload "v${current_package_version}" bin/kilo-code-${current_package_version}.vsix --clobber
                    exit 0
                  fi
                  changelog_content=$(sed -E -n "/^## \\?\[?v?${current_package_version}\\?\]?/,/^## /p" CHANGELOG.md | sed '$d')
                  if [ -z "$changelog_content" ]; then
                    changelog_content=$(sed -n "/^## ${current_package_version}$/,/^## /p" CHANGELOG.md | sed '$d')
                  fi
                  test -n "$changelog_content"
                  gh release create "v${current_package_version}" --title "Release v${current_package_version}" --notes "$changelog_content" --target main bin/kilo-code-${current_package_version}.vsix
            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v6
              with:
                  name: kilo-code-vsix
                  path: bin/kilo-code-${{ steps.get-version.outputs.version }}.vsix

    publish-vscode:
        needs: create-release
        runs-on: ubuntu-latest
        if: >
            ( github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'main' &&
            contains(github.event.pull_request.title, 'Changeset version bump') ) ||
            github.event_name == 'workflow_dispatch'
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: main
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install
            - name: Download VSIX artifact
              uses: actions/download-artifact@v7
              with:
                  name: kilo-code-vsix
                  path: bin/
            - name: Publish to VS Code Marketplace
              continue-on-error: true
              env:
                  VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
                  OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
              run: |
                  current_package_version="${{ needs.create-release.outputs.version }}"
                  cd src
                  npx vsce publish --packagePath ../bin/kilo-code-${current_package_version}.vsix
                  npx ovsx publish ../bin/kilo-code-${current_package_version}.vsix

    publish-jetbrains:
        needs: create-release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        if: >
            ( github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'main' &&
            contains(github.event.pull_request.title, 'Changeset version bump') ) ||
            github.event_name == 'workflow_dispatch'
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: main
                  submodules: recursive
                  lfs: true
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - uses: actions/setup-java@v5
              with:
                  distribution: "jetbrains"
                  java-version: "21"
                  check-latest: false
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5
              with:
                  cache-read-only: false
            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev pkg-config build-essential python3
            - name: Turbo cache setup
              uses: actions/cache@v5
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install dependencies
              run: pnpm install
            - name: Create .env file
              run: echo "KILOCODE_POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> .env
            - name: Build JetBrains Plugin
              run: pnpm run jetbrains:bundle
            - name: Get bundle name
              run: echo "BUNDLE_NAME=$(node jetbrains/plugin/scripts/get_bundle_name.js)" >> $GITHUB_ENV
            - name: Attach to GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  current_package_version="${{ needs.create-release.outputs.version }}"
                  gh release upload "v${current_package_version}" "jetbrains/plugin/build/distributions/${{ env.BUNDLE_NAME }}#JetBrains Plugin" --clobber
            - name: Upload artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ${{ env.BUNDLE_NAME }}
                  path: jetbrains/plugin/build/distributions/${{ env.BUNDLE_NAME }}
            - name: Publish to JetBrains Marketplace
              continue-on-error: true
              run: |
                  curl -X POST -H "Authorization: Bearer ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}" -F "file=@jetbrains/plugin/build/distributions/${{ env.BUNDLE_NAME }}" -F "pluginId=28350" -F "channel=stable" -F "isHidden=false" https://plugins.jetbrains.com/plugin/uploadPlugin
