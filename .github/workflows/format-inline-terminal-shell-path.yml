name: Format Inline Terminal Shell Changes

on:
  push:
    branches: [feature/inline-terminal-shell-path]
    paths: [.github/workflows/format-inline-terminal-shell-path.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/inline-terminal-shell-path
      - name: Format changed source files
        run: |
          npx --yes prettier@3.4.2 --write \
            packages/types/src/global-settings.ts \
            packages/types/src/vscode-extension-host.ts \
            src/core/prompts/sections/system-info.ts \
            src/core/prompts/system.ts \
            src/core/prompts/types.ts \
            src/core/task/Task.ts \
            src/core/tools/ExecuteCommandTool.ts \
            src/core/webview/ClineProvider.ts \
            src/core/webview/generateSystemPrompt.ts \
            src/integrations/terminal/ExecaTerminal.ts \
            src/integrations/terminal/ExecaTerminalProcess.ts \
            src/utils/shell.ts \
            webview-ui/src/components/settings/SettingsView.tsx \
            webview-ui/src/components/settings/TerminalSettings.tsx \
            webview-ui/src/i18n/locales/en/settings.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/format-inline-terminal-shell-path.yml'
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format inline terminal shell changes"
          git push origin HEAD:feature/inline-terminal-shell-path
