name: Apply Inline Terminal Shell Patch

on:
  push:
    branches: [feature/inline-terminal-shell-path]
    paths: [.github/workflows/apply-inline-terminal-shell-path.yml]

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/inline-terminal-shell-path
      - name: Apply guarded source updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          def edit(path, fn):
              p = Path(path); old = p.read_text(); new = fn(old)
              if new == old: raise RuntimeError(f"{path}: edit made no change")
              p.write_text(new)

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1: raise RuntimeError(f"{label}: expected 1 occurrence, got {n}")
              return text.replace(old, new, 1)

          # Repair accidental case change and expose new persisted setting.
          edit("packages/types/src/global-settings.ts", lambda s: once(s, '"SambaNovaApiKey"', '"sambaNovaApiKey"', "sambaNova key"))
          edit("packages/types/src/vscode-extension-host.ts", lambda s: once(
              s, '\t| "terminalShellIntegrationDisabled"\n\t| "terminalCommandDelay"',
              '\t| "terminalShellIntegrationDisabled"\n\t| "terminalInlineShellPath"\n\t| "terminalCommandDelay"', "ExtensionState"))

          def provider(s):
              s = once(s, '\t\t\tterminalShellIntegrationDisabled,\n\t\t\tterminalCommandDelay,',
                       '\t\t\tterminalShellIntegrationDisabled,\n\t\t\tterminalInlineShellPath,\n\t\t\tterminalCommandDelay,', "provider destructure")
              s = once(s, '\t\t\tterminalShellIntegrationDisabled: terminalShellIntegrationDisabled ?? true,\n\t\t\tterminalCommandDelay: terminalCommandDelay ?? 0,',
                       '\t\t\tterminalShellIntegrationDisabled: terminalShellIntegrationDisabled ?? true,\n\t\t\tterminalInlineShellPath,\n\t\t\tterminalCommandDelay: terminalCommandDelay ?? 0,', "provider post state")
              s = once(s, '\t\t\tterminalShellIntegrationDisabled: stateValues.terminalShellIntegrationDisabled ?? true,\n\t\t\tterminalCommandDelay: stateValues.terminalCommandDelay ?? 0,',
                       '\t\t\tterminalShellIntegrationDisabled: stateValues.terminalShellIntegrationDisabled ?? true,\n\t\t\tterminalInlineShellPath: stateValues.terminalInlineShellPath,\n\t\t\tterminalCommandDelay: stateValues.terminalCommandDelay ?? 0,', "provider getState")
              return s
          edit("src/core/webview/ClineProvider.ts", provider)

          def settings_view(s):
              s = once(s, '\t\tterminalShellIntegrationDisabled, // Added from upstream\n\t\tterminalCommandDelay,',
                       '\t\tterminalShellIntegrationDisabled, // Added from upstream\n\t\tterminalInlineShellPath,\n\t\tterminalCommandDelay,', "settings destructure")
              s = once(s, '\t\t\t\t\tterminalShellIntegrationDisabled,\n\t\t\t\t\tterminalCommandDelay,',
                       '\t\t\t\t\tterminalShellIntegrationDisabled,\n\t\t\t\t\tterminalInlineShellPath: terminalInlineShellPath?.trim() || undefined,\n\t\t\t\t\tterminalCommandDelay,', "settings save")
              s = once(s, '\t\t\t\tterminalShellIntegrationDisabled={terminalShellIntegrationDisabled}\n\t\t\t\tterminalCommandDelay={terminalCommandDelay}',
                       '\t\t\t\tterminalShellIntegrationDisabled={terminalShellIntegrationDisabled}\n\t\t\t\tterminalInlineShellPath={terminalInlineShellPath}\n\t\t\t\tterminalCommandDelay={terminalCommandDelay}', "settings props")
              return s
          edit("webview-ui/src/components/settings/SettingsView.tsx", settings_view)

          def terminal_ui(s):
              s = once(s, 'import { VSCodeCheckbox, VSCodeLink } from "@vscode/webview-ui-toolkit/react"',
                       'import { VSCodeCheckbox, VSCodeLink, VSCodeTextField } from "@vscode/webview-ui-toolkit/react"', "text field import")
              s = once(s, '\tterminalShellIntegrationDisabled?: boolean\n\tterminalCommandDelay?: number',
                       '\tterminalShellIntegrationDisabled?: boolean\n\tterminalInlineShellPath?: string\n\tterminalCommandDelay?: number', "terminal prop")
              s = once(s, '\t\t| "terminalShellIntegrationDisabled"\n\t\t| "terminalCommandDelay"',
                       '\t\t| "terminalShellIntegrationDisabled"\n\t\t| "terminalInlineShellPath"\n\t\t| "terminalCommandDelay"', "terminal key")
              s = once(s, '\tterminalShellIntegrationDisabled,\n\tterminalCommandDelay,',
                       '\tterminalShellIntegrationDisabled,\n\tterminalInlineShellPath,\n\tterminalCommandDelay,', "terminal destructure")
              marker = '\t\t\t\t\t\t{!terminalShellIntegrationDisabled && ('
              if s.count(marker) != 1: raise RuntimeError(f"terminal UI marker count {s.count(marker)}")
              field = '''\t\t\t\t\t\t{(terminalShellIntegrationDisabled ?? true) && (\n\t\t\t\t\t\t\t<SearchableSetting settingId="terminal-inline-shell-path" section="terminal" label={t("settings:terminal.inlineShellPath.label")}>\n\t\t\t\t\t\t\t\t<label className="block font-medium mb-1">{t("settings:terminal.inlineShellPath.label")}</label>\n\t\t\t\t\t\t\t\t<VSCodeTextField\n\t\t\t\t\t\t\t\t\tvalue={terminalInlineShellPath ?? ""}\n\t\t\t\t\t\t\t\t\tplaceholder="/bin/bash"\n\t\t\t\t\t\t\t\t\tonInput={(event: any) => setCachedStateField("terminalInlineShellPath", event.target.value)}\n\t\t\t\t\t\t\t\t\tstyle={{ width: "100%" }}\n\t\t\t\t\t\t\t\t\tdata-testid="terminal-inline-shell-path-input"\n\t\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t\t\t<div className="text-vscode-descriptionForeground text-sm mt-1">{t("settings:terminal.inlineShellPath.description")}</div>\n\t\t\t\t\t\t\t</SearchableSetting>\n\t\t\t\t\t\t)}\n\n\t\t\t\t\t\t{!(terminalShellIntegrationDisabled ?? true) && ('''
              return s.replace(marker, field, 1)
          edit("webview-ui/src/components/settings/TerminalSettings.tsx", terminal_ui)

          p = Path("webview-ui/src/i18n/locales/en/settings.json")
          data = json.loads(p.read_text())
          if "inlineShellPath" in data["terminal"]: raise RuntimeError("translation already exists")
          out = {}
          for k,v in data["terminal"].items():
              out[k]=v
              if k == "shellIntegrationDisabled": out["inlineShellPath"]={"label":"Inline terminal shell path","description":"Shell executable used by the inline terminal. Leave empty to use the system default."}
          data["terminal"] = out
          p.write_text(json.dumps(data, ensure_ascii=False, indent="\t") + "\n")

          def system_info(s):
              s=once(s,'export function getSystemInfoSection(cwd: string): string {','export function getSystemInfoSection(cwd: string, shell: string = getShell()): string {',"system info signature")
              return once(s,'Default Shell: ${getShell()}','Default Shell: ${shell}',"system info shell")
          edit("src/core/prompts/sections/system-info.ts", system_info)
          edit("src/core/prompts/types.ts", lambda s: once(s,'\tnewTaskRequireTodos: boolean\n','\tnewTaskRequireTodos: boolean\n\tterminalShellIntegrationDisabled?: boolean\n\tterminalInlineShellPath?: string\n',"prompt settings"))

          def system_prompt(s):
              s=once(s,'import { isEmpty } from "../../utils/object"','import { isEmpty } from "../../utils/object"\nimport { getEffectiveShell } from "../../utils/shell"',"effective shell import")
              guard='\tif (!context) {\n\t\tthrow new Error("Extension context is required for generating system prompt")\n\t}\n'
              # First guard belongs to generatePrompt; second to SYSTEM_PROMPT.
              positions=[m.start() for m in re.finditer(re.escape(guard),s)]
              if len(positions)!=2: raise RuntimeError(f"system context guards {len(positions)}")
              add='\n\tconst effectiveShell = getEffectiveShell(settings?.terminalShellIntegrationDisabled, settings?.terminalInlineShellPath)\n'
              # Insert from the end so offsets remain valid.
              for pos in reversed(positions):
                  end=pos+len(guard); s=s[:end]+add+s[end:]
              s=once(s,'${getSystemInfoSection(cwd)}','${getSystemInfoSection(cwd, effectiveShell)}',"system info call")
              s=once(s,'\t\tshell: vscode.env.shell,','\t\tshell: effectiveShell,',"custom prompt shell")
              return s
          edit("src/core/prompts/system.ts", system_prompt)

          def preview(s):
              s=once(s,'\t\tmaxConcurrentFileReads,\n\t\tenableSubfolderRules,','\t\tmaxConcurrentFileReads,\n\t\tenableSubfolderRules,\n\t\tterminalShellIntegrationDisabled,\n\t\tterminalInlineShellPath,',"preview destructure")
              needle='\t\t\ttoolProtocol,\n\t\t\tisStealthModel:'
              repl='\t\t\tterminalShellIntegrationDisabled: terminalShellIntegrationDisabled ?? true,\n\t\t\tterminalInlineShellPath,\n\t\t\ttoolProtocol,\n\t\t\tisStealthModel:'
              return once(s,needle,repl,"preview settings")
          edit("src/core/webview/generateSystemPrompt.ts", preview)

          def task_prompt(s):
              start=s.find("\tprivate async getSystemPrompt(): Promise<string> {")
              if start<0: raise RuntimeError("getSystemPrompt not found")
              end=s.find("\n\tprivate ",start+1)
              if end<0: raise RuntimeError("getSystemPrompt end not found")
              seg=s[start:end]
              seg=once(seg,'\t\t\tapiConfiguration,\n','\t\t\tapiConfiguration,\n\t\t\tterminalShellIntegrationDisabled,\n\t\t\tterminalInlineShellPath,\n',"task state")
              needle='\t\t\t\ttoolProtocol,'
              repl='\t\t\t\tterminalShellIntegrationDisabled: terminalShellIntegrationDisabled ?? true,\n\t\t\t\tterminalInlineShellPath,\n\t\t\t\ttoolProtocol,'
              seg=once(seg,needle,repl,"task prompt settings")
              return s[:start]+seg+s[end:]
          edit("src/core/task/Task.ts", task_prompt)
          print("all guarded edits applied")
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-inline-terminal-shell-path.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: configure inline terminal shell path"
          git push origin HEAD:feature/inline-terminal-shell-path
