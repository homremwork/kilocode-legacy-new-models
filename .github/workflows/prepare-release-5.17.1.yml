name: Prepare release 5.17.1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/5.17.1-clion-2026.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/5.17.1-clion-2026.2
          fetch-depth: 0

      - name: Apply release patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          version = "5.17.1"

          package_path = Path("src/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") not in {"5.17.0", version}:
              raise RuntimeError(f"Unexpected version: {package.get('version')}")
          package["version"] = version
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent="\t") + "\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          if not changelog.startswith("## 5.17.1\n"):
              changelog_path.write_text(
                  "## 5.17.1\n\n"
                  "### Fixed\n\n"
                  "- Restored JCEF WebView support in CLion 2026.2 by declaring the separated JCEF platform module.\n\n"
                  + changelog
              )

          plugin_xml_path = Path("jetbrains/plugin/src/main/resources/META-INF/plugin.xml.template")
          plugin_xml = plugin_xml_path.read_text()
          jcef_dep = "    <depends>com.intellij.modules.jcef</depends>\n"
          if jcef_dep not in plugin_xml:
              marker = "    <depends>com.intellij.modules.platform</depends>\n"
              if marker not in plugin_xml:
                  raise RuntimeError("plugin.xml dependency marker not found")
              plugin_xml = plugin_xml.replace(marker, marker + jcef_dep, 1)
          plugin_xml_path.write_text(plugin_xml)

          gradle_path = Path("jetbrains/plugin/build.gradle.kts")
          gradle = gradle_path.read_text()
          jcef_build_dep = '        bundledPlugin("intellij.platform.ui.jcef")\n'
          if jcef_build_dep not in gradle:
              marker = '        create(properties("platformType"), properties("platformVersion"))\n'
              if marker not in gradle:
                  raise RuntimeError("Gradle IntelliJ dependency marker not found")
              gradle = gradle.replace(marker, marker + "\n" + jcef_build_dep, 1)
          gradle_path.write_text(gradle)

          properties_path = Path("jetbrains/plugin/gradle.properties.template")
          properties = properties_path.read_text()
          properties = properties.replace("platformVersion=2024.3", "platformVersion=2025.3.1")
          properties = properties.replace("pluginSinceBuild=243", "pluginSinceBuild=253")
          properties_path.write_text(properties)

          for temporary in [
              Path(".github/workflows/one-shot-release-5.17.1.yml"),
              Path(".github/workflows/prepare-release-5.17.1.yml"),
          ]:
              temporary.unlink(missing_ok=True)
          PY

      - name: Commit prepared release
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Release patch already prepared"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(jetbrains): support CLion 2026.2"
          git push origin HEAD:release/5.17.1-clion-2026.2
