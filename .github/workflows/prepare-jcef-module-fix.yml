name: Prepare JCEF module rebuild

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'fix/5.17.1-jcef-module'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/5.17.1-jcef-module
          fetch-depth: 0

      - name: Correct JCEF dependency kind
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("jetbrains/plugin/build.gradle.kts")
          text = path.read_text()
          old = 'bundledPlugin("intellij.platform.ui.jcef")'
          new = 'bundledModule("intellij.platform.ui.jcef")'
          if old not in text and new not in text:
              raise RuntimeError("JCEF dependency declaration not found")
          path.write_text(text.replace(old, new, 1))

          Path(".github/workflows/prepare-jcef-module-fix.yml").unlink(missing_ok=True)
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(jetbrains): declare JCEF as bundled module"
          git push origin HEAD:fix/5.17.1-jcef-module
